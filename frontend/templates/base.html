<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Health Analytics{% endblock %}</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/style.css" />
  {% block head %}{% endblock %}
</head>
<body class="bg-light">

  <!-- ── Navbar ─────────────────────────────────────────────────────────── -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/dashboard">
        <i class="fas fa-heartbeat me-2"></i>HealthTrack
      </a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#navbarMain"
              aria-controls="navbarMain" aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarMain">
        <!-- Shown when logged in -->
        <ul class="navbar-nav ms-auto align-items-center" id="nav-authed" style="display:none!important">
          <li class="nav-item">
            <a class="nav-link" href="/dashboard"><i class="fas fa-home me-1"></i>Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/health/add"><i class="fas fa-plus-circle me-1"></i>Add Data</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/analytics"><i class="fas fa-chart-bar me-1"></i>Analytics</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/history"><i class="fas fa-history me-1"></i>History</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/api-docs"><i class="fas fa-book-open me-1"></i>API Docs</a>
          </li>
          <li class="nav-item ms-2">
            <span class="navbar-text text-white-50 small me-2" id="nav-username"></span>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-light btn-sm" onclick="logout()">
              <i class="fas fa-sign-out-alt me-1"></i>Logout
            </button>
          </li>
        </ul>
        <!-- Shown when logged out -->
        <ul class="navbar-nav ms-auto" id="nav-unauthed">
          <li class="nav-item">
            <a class="nav-link" href="/login"><i class="fas fa-sign-in-alt me-1"></i>Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/register"><i class="fas fa-user-plus me-1"></i>Register</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ── Toast Container ────────────────────────────────────────────────── -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container" style="z-index:9999"></div>

  <!-- ── Main Content ───────────────────────────────────────────────────── -->
  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <!-- ── Footer ────────────────────────────────────────────────────────── -->
  <footer class="bg-primary text-white text-center py-3 mt-5">
    <small>&copy; 2025 HealthTrack &mdash; Scalable Cloud Health Analytics</small>
  </footer>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Shared utilities -->
  <script src="/static/js/main.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
