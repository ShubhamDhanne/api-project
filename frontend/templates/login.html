{% extends "base.html" %}
{% block title %}Login — HealthTrack{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">

    <div class="text-center mb-4">
      <i class="fas fa-heartbeat text-primary fa-3x mb-2"></i>
      <h3 class="fw-bold">Welcome Back</h3>
      <p class="text-muted">Sign in to your HealthTrack account</p>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <form id="login-form" novalidate>
          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
              <input type="email" id="email" name="email"
                     class="form-control" placeholder="you@example.com" required autocomplete="email" />
            </div>
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
              <input type="password" id="password" name="password"
                     class="form-control" placeholder="••••••••" required autocomplete="current-password" />
              <button class="btn btn-outline-secondary" type="button" id="toggle-pwd" tabindex="-1">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback">Password is required.</div>
          </div>

          <!-- Error message -->
          <div id="login-error" class="alert alert-danger d-none py-2 small"></div>

          <!-- Submit -->
          <div class="d-grid mt-3">
            <button type="submit" class="btn btn-primary" id="login-btn">
              <span id="login-spinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
              Sign In
            </button>
          </div>
        </form>
      </div>
    </div>

    <p class="text-center mt-3 text-muted small">
      Don't have an account? <a href="/register" class="fw-semibold">Register</a>
    </p>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
